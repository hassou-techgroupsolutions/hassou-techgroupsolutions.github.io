<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020817">
  <title>Offline · HASSOU TechGroup Solutions</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:
      radial-gradient(circle at 50% 30%,rgba(15,230,247,.12),transparent 28%),
      linear-gradient(145deg,#000c2b,#020817 55%,#04142c);color:#dbeafe;
      font:16px/1.6 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
    .card{width:min(560px,100%);padding:34px;border:1px solid rgba(15,230,247,.2);border-radius:28px;
      background:rgba(3,15,40,.86);box-shadow:0 30px 90px rgba(0,0,0,.35),0 0 44px rgba(15,230,247,.08)}
    img{display:block;width:104px;height:104px;object-fit:contain;border-radius:26px;margin:0 auto 20px;
      box-shadow:0 0 30px rgba(15,230,247,.16)}
    h1{margin:0 0 8px;font-size:clamp(2rem,7vw,3.2rem);line-height:1.05;color:#fff}
    p{margin:0;color:#9fb5d1}
    a{display:inline-block;margin-top:22px;padding:11px 18px;border:1px solid rgba(15,230,247,.34);border-radius:999px;
      background:linear-gradient(90deg,#0b66e4,#0b9ff5,#0fe6f7);color:#00102f;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <img src="images/hassou-mark-clean.webp" alt="HASSOU TechGroup Solutions">
    <h1>You’re offline.</h1>
    <p>The HASSOU TechGroup Solutions portfolio needs a connection for content that is not already cached.</p>

  </main>
</body>
</html>
